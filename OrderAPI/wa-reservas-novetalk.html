<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>WA Restaurant — Agente NoveTalk</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#090d11;font-family:'Segoe UI',system-ui,sans-serif;color:#e9edef;overflow:hidden}

/* layout */
#root{display:flex;flex-direction:column;height:100%;max-width:1500px;margin:0 auto}

/* tabs */
#tabs{display:flex;gap:6px;padding:8px 10px;background:#111b21;border-bottom:1px solid #1e2d34;overflow-x:auto;flex-shrink:0}
#tabs::-webkit-scrollbar{display:none}
.tab{padding:5px 13px;border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(255,255,255,.15);color:#8696a0;background:transparent;white-space:nowrap;flex-shrink:0;outline:none}
.tab.on{background:#00a884;border-color:#00a884;color:#fff}

/* two columns */
#cols{display:flex;flex:1;overflow:hidden}

/* chat */
#chat-col{display:flex;flex-direction:column;width:50%;min-width:280px;background:#111b21}
#chat-hdr{background:#202c33;padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.05)}
.av{width:36px;height:36px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.cn{font-size:14px;color:#e9edef;font-weight:500}
.cs{font-size:11px;color:#00a884}
#msgs{flex:1;overflow-y:auto;padding:12px 5%;display:flex;flex-direction:column;gap:3px;background:#0b141a}
#msgs::-webkit-scrollbar{width:4px}
#msgs::-webkit-scrollbar-thumb{background:#2a3942;border-radius:4px}
.dchip{text-align:center;margin:8px 0}
.dchip span{background:#182229;color:#8696a0;font-size:11px;padding:3px 11px;border-radius:6px}
.row{display:flex;flex-direction:column}
.row.out{align-items:flex-end}
.row.in{align-items:flex-start}
.lbl{font-size:10.5px;font-weight:700;margin-bottom:2px;padding:0 3px;color:#4ade80}
.bub{max-width:80%;padding:7px 10px 5px;font-size:13.5px;line-height:1.55;position:relative;word-break:break-word;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.bub.in{background:#202c33;color:#e9edef;border-radius:0 9px 9px 9px}
.bub.out{background:#005c4b;color:#e9edef;border-radius:9px 0 9px 9px}
.ti{position:absolute;top:0;left:-7px;width:0;height:0;border-top:7px solid #202c33;border-left:7px solid transparent}
.to{position:absolute;top:0;right:-7px;width:0;height:0;border-top:7px solid #005c4b;border-right:7px solid transparent}
.meta{display:flex;justify-content:flex-end;gap:3px;margin-top:3px}
.mt{font-size:10px;color:#8696a0}
.tk{font-size:12px;color:#53bdeb}
.qr{border-top:1px solid rgba(255,255,255,.07);margin-top:6px;padding-top:5px}
.qb{color:#53bdeb;font-size:12.5px;text-align:center;padding:4px 5px}
.pill{display:flex;justify-content:center;margin:6px 0}
.pill span{background:#0f172a;border:1px solid #334155;border-radius:20px;padding:3px 12px;font-size:11px;color:#a5b4fc;font-family:monospace}
#bar{background:#202c33;padding:9px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.fake-input{flex:1;background:#2a3942;border-radius:20px;padding:8px 14px;color:#8696a0;font-size:13.5px}

/* resizer */
#rsz{width:4px;background:#21262d;cursor:col-resize;flex-shrink:0;transition:background .15s}
#rsz:hover{background:#58a6ff}

/* panel */
#panel-col{flex:1;min-width:260px;display:flex;flex-direction:column;background:#0d1117;overflow:hidden}
#phdr{padding:11px 14px;border-bottom:1px solid #21262d;flex-shrink:0}
.pt{font-size:10.5px;font-weight:600;color:#6e7681;text-transform:uppercase;letter-spacing:.08em}
.ps{font-size:10.5px;color:#6e7681;opacity:.6;margin-top:2px}
#panel{flex:1;overflow-y:auto;padding:12px 12px 12px 14px}
#panel::-webkit-scrollbar{width:7px}
#panel::-webkit-scrollbar-track{background:#161b22}
#panel::-webkit-scrollbar-thumb{background:#30363d;border-radius:4px}
#panel::-webkit-scrollbar-thumb:hover{background:#484f58}

/* cards */
.card{border-radius:8px;overflow:hidden;margin-bottom:10px}
.card-hdr{padding:8px 12px;display:flex;align-items:center;gap:7px;border-bottom-width:1px;border-bottom-style:solid}
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.card-title{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.card-body{padding:12px 13px;background:#0d1117}
.desc{font-size:12.5px;color:#8b949e;line-height:1.65;margin-bottom:10px}
.step{display:flex;gap:9px;align-items:flex-start;padding:5px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.step:last-child{border-bottom:none}
.sn{width:18px;height:18px;border-radius:50%;background:rgba(45,212,191,.12);color:#2dd4bf;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;flex-shrink:0;margin-top:1px}
.st{font-size:12.5px;color:#c9d1d9;line-height:1.5}
.st em{color:#7ee787;font-style:normal;font-weight:600}
pre.code{background:#010409;border-radius:6px;padding:11px 13px;font-size:12.5px;line-height:1.75;color:#c9d1d9;overflow-x:auto;border:1px solid rgba(255,255,255,.06);white-space:pre;font-family:'Cascadia Code','Fira Code',Consolas,monospace;margin-top:8px}
pre.code::-webkit-scrollbar{height:4px}
pre.code::-webkit-scrollbar-thumb{background:#30363d}
.kw{color:#ff7b72}.url{color:#79c0ff}.str{color:#a5d6ff}.key{color:#7ee787}.num{color:#f2cc60}.cm{color:#6e7681;font-style:italic}
.r201{display:inline-block;background:#0a2010;color:#3fb950;border:1px solid #1a4020;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;margin-bottom:5px}
.r409{display:inline-block;background:#180c0c;color:#f85149;border:1px solid #381818;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:700;margin-bottom:5px}

/* mobile: stack vertically */
@media(max-width:640px){
  #cols{flex-direction:column}
  #chat-col{width:100%;min-height:55%}
  #rsz{display:none}
  #panel-col{min-width:unset;border-top:2px solid #21262d}
}
</style>
</head>

  <div id="tabs"></div>
  <div id="cols">
    <div id="chat-col">

          <div class="cn">WA Restaurant &#x1F419;</div>

      <div id="panel"></div>
    </div>
  </div>

// -- RENDER --------------------------------------------------------------------

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function render(idx){
  // tabs
  const te=document.getElementById('tabs');
  te.innerHTML='';
  SCENES.forEach((sc,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===idx?' on':'');
    b.textContent=sc.label;
    b.onclick=()=>render(i);
    te.appendChild(b);
  });

  const sc=SCENES[idx];

  // messages
  const me=document.getElementById('msgs');
  me.innerHTML='<div class="dchip"><span>Hoje</span></div>';
  sc.msgs.forEach(m=>{
    if(m.s==='api'){
      const d=document.createElement('div');
      d.className='pill';
      d.innerHTML='<span>→ '+esc(m.text)+'</span>';
      me.appendChild(d);
    } else {
      const row=document.createElement('div');
      row.className='row '+(m.s==='user'?'out':'in');
      if(m.lbl){const l=document.createElement('div');l.className='lbl';l.textContent=m.lbl;row.appendChild(l);}
      const b=document.createElement('div');
      b.className='bub '+(m.s==='user'?'out':'in');
      const tail=document.createElement('span');
      tail.className=m.s==='user'?'to':'ti';
      b.appendChild(tail);
      const txt=document.createElement('span');
      txt.innerHTML=esc(m.text).replace(/\n/g,'<br>').replace(/\*(.*?)\*/g,'<strong>$1</strong>');
      b.appendChild(txt);
      if(m.opts){
        const qr=document.createElement('div');qr.className='qr';
        m.opts.forEach(o=>{const d=document.createElement('div');d.className='qb';d.textContent=o;qr.appendChild(d);});
        b.appendChild(qr);
      }
      const meta=document.createElement('div');meta.className='meta';
      meta.innerHTML='<span class="mt">'+H+'</span>'+(m.s==='user'?'<span class="tk">✓✓</span>':'');
      b.appendChild(meta);
      row.appendChild(b);
      me.appendChild(row);
    }
  });
  me.scrollTop=0;

  // panel
  const pe=document.getElementById('panel');
  pe.innerHTML='';
  sc.msgs.filter(m=>m.ann).forEach(m=>{
    const ann=m.ann;
    const c=ANN[ann.t]||ANN.logic;
    const card=document.createElement('div');
    card.className='card';
    card.style.border='1px solid '+c.bd;

    const hdr=document.createElement('div');
    hdr.className='card-hdr';
    hdr.style.background=c.bg;
    hdr.style.borderBottomColor=c.bd;
    hdr.innerHTML='<div class="dot" style="background:'+c.tx+'"></div><span class="card-title" style="color:'+c.tx+'">'+esc(ann.ti)+'</span>';
    card.appendChild(hdr);

    const body=document.createElement('div');
    body.className='card-body';

    if(ann.desc){const d=document.createElement('div');d.className='desc';d.textContent=ann.desc;body.appendChild(d);}

    if(ann.steps){
      ann.steps.forEach((s,i)=>{
        const row=document.createElement('div');
        row.className='step';
        row.innerHTML='<div class="sn">'+s.n+'</div><div class="st">'+s.t+'</div>';
        body.appendChild(row);
      });
    }

    if(ann.code){
      const pre=document.createElement('pre');
      pre.className='code';
      pre.innerHTML=ann.code;
      body.appendChild(pre);
    }

    card.appendChild(body);
    pe.appendChild(card);
  });
  pe.scrollTop=0;
}

// -- RESIZER -------------------------------------------------------------------
(function(){
  const rsz=document.getElementById('rsz');
  const cc=document.getElementById('chat-col');
  const root=document.getElementById('cols');
  let drag=false,sx=0,sw=0;
  rsz.addEventListener('mousedown',e=>{drag=true;sx=e.clientX;sw=cc.offsetWidth;rsz.style.background='#58a6ff';document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(!drag)return;const rw=root.offsetWidth;const nw=Math.max(280,Math.min(sw+e.clientX-sx,rw-280));cc.style.width=nw+'px';});
  document.addEventListener('mouseup',()=>{if(!drag)return;drag=false;rsz.style.background='';document.body.style.cursor='';document.body.style.userSelect='';});
})();

render(0);
</script>
</body>
